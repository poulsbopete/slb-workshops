# Shared Instruqt sandbox definition for SLB workshops.
# Each track copies this file; customize memory/cpus per workshop if needed.
# IMPORTANT: Do NOT put ESS_CLOUD_API_KEY / LLM_PROXY_PROD under environment:
# (that injects the literal "$ESS_CLOUD_API_KEY" and Cloud auth fails with 401).
# Declare them only under secrets: so Instruqt injects the real values.
version: "3"
virtualmachines:
- name: es3-api
  image: elastic/es3-api-v2
  shell: /bin/bash
  environment:
    PRODUCT_TIER: complete
    PROJECT_TYPE: observability
    REGIONS: aws-us-east-1
  memory: 12288
  cpus: 4
  allow_external_ingress:
  - http
  - https
  - high-ports
secrets:
- name: LLM_PROXY_PROD
- name: ESS_CLOUD_API_KEY
